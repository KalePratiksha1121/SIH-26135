{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container mt-5" style="max-width: 480px;">
    <div class="card card-hover p-4">
        <div class="text-center mb-4">
            <div style="width:64px;height:64px;background:var(--gov-orange);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;">
                <i class="bi bi-person-lock" style="font-size:28px;color:white;"></i>
            </div>
            <h4 class="fw-bold" style="color:var(--gov-dark);">Role Login</h4>
            <p class="text-muted">Select your role and enter password</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <select name="username" class="form-select form-select-lg">
                    <option value="gov_admin">gov_admin — Government Admin</option>
                    <option value="employer1">employer1 — Employer</option>
                    <option value="trainee_demo">trainee_demo — Trainee</option>
                    <option value="provider1">provider1 — Training Provider</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" name="password" class="form-control form-control-lg" value="1234" placeholder="Password">
            </div>
            <button type="submit" class="btn btn-lg w-100 text-white" style="background:var(--gov-orange);">Login</button>
        </form>

        <div class="mt-3 text-center">
            <small class="text-muted">Password for all demo accounts: <code>1234</code></small>
        </div>
    </div>

    <div class="text-center mt-3">
        <a href="{% url 'seed' %}" class="text-decoration-none" style="font-size:13px;color:var(--gov-orange);">
            <i class="bi bi-database-add"></i> Click here to load demo data first
        </a>
    </div>
</div>
{% endblock %}
